name: Build VegaMovies

concurrency:
  group: vegamovies-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "VegaMovies/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6.0.2
        with:
          path: src

      - name: Checkout builds branch
        uses: actions/checkout@v6.0.2
        with:
          ref: builds
          path: builds

      - name: Set up JDK 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: adopt
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: platform-tools

      - name: Build VegaMovies only
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon make makePluginsJson

          test -f VegaMovies/build/VegaMovies.cs3
          test -f build/plugins.json
          jq -e 'length == 1 and .[0].name == "VegaMovies"' build/plugins.json >/dev/null

      - name: Publish repository files
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # The builds branch is a distribution branch, not a source-code mirror.
          find "$GITHUB_WORKSPACE/builds" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          cp "$GITHUB_WORKSPACE/src/VegaMovies/build/VegaMovies.cs3" "$GITHUB_WORKSPACE/builds/"
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds/plugins.json"

          cat > "$GITHUB_WORKSPACE/builds/CS.json" <<'EOF'
          {
            "name": "VegaMovies",
            "description": "VegaMovies CloudStream extension",
            "iconUrl": "https://raw.githubusercontent.com/ytseel/CSX/master/VegaMovies/icon.jpg",
            "manifestVersion": 2,
            "pluginLists": [
              "https://raw.githubusercontent.com/ytseel/CSX/builds/plugins.json"
            ]
          }
          EOF

          cd "$GITHUB_WORKSPACE/builds"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Build VegaMovies ${SOURCE_SHA}"
            git push origin HEAD:builds
          else
            echo "No build output changes to publish."
          fi
